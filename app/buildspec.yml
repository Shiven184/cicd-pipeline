version: 0.2

# Each phase runs from the repo root directory.
# We set the working directory once using env variables
# and reference it consistently across all phases.

phases:

  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Install phase - setting up Node.js"
      - node --version
      - npm --version
      - npm install --prefer-offline --prefix app

  pre_build:
    commands:
      - echo "Pre-build phase - running checks"
      - npm test --prefix app

  build:
    commands:
      - echo "Build phase - packaging application"
      - echo "Build number $CODEBUILD_BUILD_NUMBER"

  post_build:
    commands:
      - echo "Post-build phase - creating deployment package"
      - cd app && zip -r ../deploy-package.zip . -x "*.git*" -x "node_modules/*"
      - echo "Package size $(du -sh ../deploy-package.zip)"
      - echo "Build complete"

artifacts:
  files:
    - deploy-package.zip
  discard-paths: yes

cache:
  paths:
    - app/node_modules/**/*
