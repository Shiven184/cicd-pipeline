version: 0.2

phases:

  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Install phase"
      - node --version
      - npm --version
      - npm install --prefix app

  pre_build:
    commands:
      - echo "Pre-build phase - running tests"
      - npm test --prefix app

  build:
    commands:
      - echo "Build phase - packaging application"
      - echo "Build number $CODEBUILD_BUILD_NUMBER"

  post_build:
    commands:
      - echo "Post-build - creating deployment package"
      - cd app
      - zip -r ../deploy-package.zip . -x "*.git*"
      - cd ..
      - echo "Package contents:"
      - unzip -l deploy-package.zip | head -20
      - echo "Package size $(du -sh deploy-package.zip)"

artifacts:
  files:
    - deploy-package.zip
  discard-paths: yes

cache:
  paths:
    - app/node_modules/**/*
