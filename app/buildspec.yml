version: 0.2

phases:

  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Install phase"
      - npm install --prefix app

  pre_build:
    commands:
      - echo "Pre-build - running tests"
      - npm test --prefix app

  build:
    commands:
      - echo "Build phase - build number $CODEBUILD_BUILD_NUMBER"

  post_build:
    commands:
      - echo "Post-build complete"

artifacts:
  # Output the app folder contents directly - NOT as a zip
  # CodePipeline wraps artifacts automatically - double zipping breaks Beanstalk
  base-directory: app
  files:
    - '**/*'
  discard-paths: no

cache:
  paths:
    - app/node_modules/**/*
