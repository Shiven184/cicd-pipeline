version: 0.2

phases:

  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Install phase"
      - cd app
      - npm install

  pre_build:
    commands:
      - echo "Pre-build - running tests"
      - cd app && npm test

  build:
    commands:
      - echo "Build phase"
      - echo "Build number $CODEBUILD_BUILD_NUMBER"

  post_build:
    commands:
      - echo "Creating deployment package"
      - cd app
      - zip -r ../deploy-package.zip .
      - cd ..
      - echo "Verifying zip structure (must show package.json at root):"
      - unzip -l deploy-package.zip | grep -E "package.json|app.js|node_modules/" | head -10

artifacts:
  files:
    - deploy-package.zip
  discard-paths: yes
