version: 0.2

phases:

  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Install phase"
      - npm install --prefix app

  pre_build:
    commands:
      - echo "Pre-build - running tests"
      - npm test --prefix app

  build:
    commands:
      - echo "Build phase - build number $CODEBUILD_BUILD_NUMBER"

  post_build:
    commands:
      - echo "Creating deployment package from app folder"
      - cd app && zip -r ../deploy-package.zip . && cd ..
      - echo "Verifying package.json is at zip root:"
      - unzip -l deploy-package.zip | grep "package.json"

artifacts:
  files:
    - deploy-package.zip
  discard-paths: yes

cache:
  paths:
    - app/node_modules/**/*
