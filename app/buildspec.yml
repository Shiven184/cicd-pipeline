version: 0.2

# This file tells CodeBuild exactly what to do during the Build stage.
# It runs inside a fresh Linux container every time.
# Phases run in order: install, pre_build, build, post_build

phases:

  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Install phase - setting up Node.js"
      - node --version
      - npm --version
      - cd app && npm ci

  pre_build:
    commands:
      - echo "Pre-build phase - running checks"
      - cd app && npm test

  build:
    commands:
      - echo "Build phase - packaging application"
      - cd app
      - echo "Build number $CODEBUILD_BUILD_NUMBER"

  post_build:
    commands:
      - echo "Post-build phase - creating deployment package"
      - cd app
      - zip -r ../deploy-package.zip . -x "*.git*"
      - echo "Package created successfully"

# This is what gets passed to the Deploy stage (Elastic Beanstalk)
artifacts:
  files:
    - deploy-package.zip
  discard-paths: yes

# Cache node_modules so installs are faster on subsequent builds
cache:
  paths:
    - app/node_modules/**/*
